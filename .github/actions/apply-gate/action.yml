name: apply-gate
description: >-
  Gate do apply: bloqueia a recriação de recursos sensíveis e qualquer destruição
  que não estivesse no plano revisado no pull request.

inputs:
  plan-json:
    description: Plano do apply em JSON (saída de `terraform show -json`).
    required: true
  comments-json:
    description: >-
      Comentários do pull request em JSON (saída de `gh api --paginate`). Sem
      eles não há plano revisado para comparar, e qualquer destruição é bloqueada.
    required: false
    default: ""
  dir:
    description: Diretório do módulo (distingue vários módulos no mesmo pull request).
    required: false
    default: "."
  approved:
    description: '"true" quando um humano aprovou a destruição (label do pull request).'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../../go.mod
        cache: false

    - name: Compila o cicd
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: go build -trimpath -o "$RUNNER_TEMP/cicd" ./cmd/cicd

    - name: Gate do apply
      shell: bash
      env:
        PLAN_JSON: ${{ inputs.plan-json }}
        COMMENTS_JSON: ${{ inputs.comments-json }}
        DIR: ${{ inputs.dir }}
        APPROVED: ${{ inputs.approved }}
        POLICY: ${{ github.action_path }}/../../../config/plan-policy.json
      run: |
        set -o pipefail
        args=(apply-gate -plan "$PLAN_JSON" -policy "$POLICY" -dir "$DIR")
        if [ -n "$COMMENTS_JSON" ]; then args+=(-comments "$COMMENTS_JSON"); fi
        if [ "$APPROVED" = "true" ]; then args+=(-approved); fi
        "$RUNNER_TEMP/cicd" "${args[@]}" | tee "$RUNNER_TEMP/relatorio-apply.txt"
        status=$?
        {
          echo '### apply-gate'
          echo '```'
          cat "$RUNNER_TEMP/relatorio-apply.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
