name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Nível 1: lógica de cada peça.
  testes:
    name: Testes (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Nível 1b: a mesma suíte, dentro do container.
  docker:
    name: Testes (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t cicd-test .

  # Nível 2: a action, do jeito que um consumidor a usa.
  # Cada cenário que deve falhar é seguido de uma conferência de que falhou
  # de verdade: sem ela, um gate quebrado que nunca reprova passaria no CI.
  dogfood:
    name: Dogfood (action de verdade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recriação de banco sem aprovação (deve reprovar)
        id: sem-aprovacao
        continue-on-error: true
        uses: ./.github/actions/plan-gate
        with:
          plan-json: testdata/plans/replace-sensitive.json

      - name: Confirma que reprovou de verdade
        env:
          RESULTADO: ${{ steps.sem-aprovacao.outcome }}
        run: |
          if [ "$RESULTADO" != "failure" ]; then
            echo "esperava failure, veio: $RESULTADO"
            exit 1
          fi

      - name: Recriação de banco com aprovação (deve liberar)
        uses: ./.github/actions/plan-gate
        with:
          plan-json: testdata/plans/replace-sensitive.json
          approved: "true"

      - name: Task definition do ECS é ignorada (deve liberar)
        uses: ./.github/actions/plan-gate
        with:
          plan-json: testdata/plans/replace-ignored.json

      - name: Entrada que não é plano (deve reprovar, nunca liberar)
        id: nao-e-plano
        continue-on-error: true
        uses: ./.github/actions/plan-gate
        with:
          plan-json: testdata/plans/not-a-plan.json

      - name: Confirma que erro de leitura reprovou de verdade
        env:
          RESULTADO: ${{ steps.nao-e-plano.outcome }}
        run: |
          if [ "$RESULTADO" != "failure" ]; then
            echo "esperava failure, veio: $RESULTADO"
            exit 1
          fi

  # Nível 3: o workflow reutilizável inteiro (inputs, ligação dos passos,
  # terraform init/plan/show). Chamada no mesmo repositório, com a ferramenta
  # na versão do commit que está sendo testado.
  contrato:
    name: Contrato do workflow reutilizável
    uses: ./.github/workflows/plan-gate.yml
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      working-directory: testdata/tf/limpo
      versao: ${{ github.sha }}

  # Prova (sem nuvem) o que o OIDC entrega: a plataforma emite um token com o
  # `sub` do repositório e do evento. É esse `sub` que a trust policy da role
  # confere (examples/aws-oidc-trust.tf). O token só vai ao endpoint do GitHub.
  oidc-claims:
    name: Claims do token OIDC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Pede o token e confere audience e subject
        env:
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          token="$(printf '%s' "$resp" | jq -r .value)"
          echo "::add-mask::$token"
          claims="$(printf '%s' "$token" | python3 -I -c '
          import sys, base64, json
          p = sys.stdin.read().split(".")[1]
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))))')"
          echo "$claims" | jq '{iss, aud, sub, repository, ref, event_name, job_workflow_ref}'

          # Repositórios criados depois de 15/07/2026 (ou que optaram) usam o
          # `sub` imutável, com os IDs numéricos. Os demais, o formato antigo.
          if [ "$EVENTO" = "pull_request" ]; then
            fim="pull_request"
          else
            fim="ref:$REF"
          fi
          nome="${REPO#*/}"
          antigo="repo:$REPO:$fim"
          imutavel="repo:$OWNER@$OWNER_ID/$nome@$REPO_ID:$fim"
          aud="$(echo "$claims" | jq -r .aud)"
          sub="$(echo "$claims" | jq -r .sub)"
          [ "$aud" = "sts.amazonaws.com" ] || { echo "aud inesperado: $aud"; exit 1; }
          if [ "$sub" = "$imutavel" ]; then
            formato="imutável"
          elif [ "$sub" = "$antigo" ]; then
            formato="antigo (por nome)"
          else
            echo "sub inesperado: $sub"
            echo "esperado: $imutavel"
            echo "      ou: $antigo"
            exit 1
          fi
          echo "sub e aud conferem, formato $formato: $sub"

  # Gate de tags, do jeito que um consumidor o usa. Os planos são REAIS (gerados
  # pelo Terraform com o provider da AWS, sem nuvem): o `tags_all` deles já traz
  # o default_tags misturado.
  dogfood-tags:
    name: Dogfood (tag-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plano com as três tags (deve liberar)
        uses: ./.github/actions/tag-check
        with:
          plan-json: testdata/real/tags-ok.json

      - name: Plano sem Environment e Owner (deve reprovar)
        id: sem-tags
        continue-on-error: true
        uses: ./.github/actions/tag-check
        with:
          plan-json: testdata/real/tags-faltando.json

      - name: Entrada que não é plano (deve reprovar, nunca liberar)
        id: nao-e-plano
        continue-on-error: true
        uses: ./.github/actions/tag-check
        with:
          plan-json: testdata/plans/not-a-plan.json

      - name: Confirma que os dois cenários reprovaram de verdade
        env:
          SEM_TAGS: ${{ steps.sem-tags.outcome }}
          NAO_E_PLANO: ${{ steps.nao-e-plano.outcome }}
        run: |
          [ "$SEM_TAGS" = "failure" ] || { echo "sem tags: esperava failure, veio $SEM_TAGS"; exit 1; }
          [ "$NAO_E_PLANO" = "failure" ] || { echo "não é plano: esperava failure, veio $NAO_E_PLANO"; exit 1; }

  # Formatação e validade. Os dois módulos inválidos erram por um motivo só cada
  # um (um está mal formatado e válido; o outro bem formatado e inválido), então
  # cada reprovação aponta para a checagem certa.
  dogfood-validate:
    name: Dogfood (terraform-validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Módulo sem nuvem (deve liberar)
        uses: ./.github/actions/terraform-validate
        with:
          working-directory: testdata/tf/limpo

      - name: Exemplo de trust policy OIDC (deve liberar)
        uses: ./.github/actions/terraform-validate
        with:
          working-directory: examples

      - name: Mal formatado (deve reprovar)
        id: formatacao
        continue-on-error: true
        uses: ./.github/actions/terraform-validate
        with:
          working-directory: testdata/tf-invalidos/formatacao

      - name: Referência inexistente (deve reprovar)
        id: invalido
        continue-on-error: true
        uses: ./.github/actions/terraform-validate
        with:
          working-directory: testdata/tf-invalidos/invalido

      - name: Confirma que os dois reprovaram de verdade
        env:
          FORMATACAO: ${{ steps.formatacao.outcome }}
          INVALIDO: ${{ steps.invalido.outcome }}
        run: |
          [ "$FORMATACAO" = "failure" ] || { echo "formatação: esperava failure, veio $FORMATACAO"; exit 1; }
          [ "$INVALIDO" = "failure" ] || { echo "inválido: esperava failure, veio $INVALIDO"; exit 1; }

  # O workflow reutilizável de validação, chamado como um consumidor chama.
  contrato-validate:
    name: Contrato do workflow de validação
    uses: ./.github/workflows/terraform-validate.yml
    permissions:
      contents: read
    with:
      working-directory: testdata/tf/limpo
      versao: ${{ github.sha }}

  # O plan-gate.yml inteiro com um módulo que TEM tags (aws_s3_bucket com
  # default_tags): prova que o passo de tags roda no workflow e libera.
  contrato-tags:
    name: Contrato do workflow com gate de tags
    uses: ./.github/workflows/plan-gate.yml
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      working-directory: testdata/tf/tags-ok
      plan-args: -refresh=false
      versao: ${{ github.sha }}

  # Auditoria de dependências, do jeito que um consumidor a usa. Os relatórios
  # são REAIS (govulncheck contra uma versão antiga e vulnerável de x/text).
  dogfood-deps:
    name: Dogfood (dependency-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Só importa o pacote vulnerável, sem chamar (deve liberar, com aviso)
        uses: ./.github/actions/dependency-audit
        with:
          report-json: testdata/real/vuln-pacote.json

      - name: Chama a função vulnerável (deve reprovar)
        id: chamada
        continue-on-error: true
        uses: ./.github/actions/dependency-audit
        with:
          report-json: testdata/real/vuln-chamada.json

      - name: Entrada que não é relatório (deve reprovar, nunca liberar)
        id: nao-e-relatorio
        continue-on-error: true
        uses: ./.github/actions/dependency-audit
        with:
          report-json: testdata/plans/clean.json

      - name: Confirma que os dois cenários reprovaram de verdade
        env:
          CHAMADA: ${{ steps.chamada.outcome }}
          NAO_E_RELATORIO: ${{ steps.nao-e-relatorio.outcome }}
        run: |
          [ "$CHAMADA" = "failure" ] || { echo "chamada: esperava failure, veio $CHAMADA"; exit 1; }
          [ "$NAO_E_RELATORIO" = "failure" ] || { echo "não é relatório: esperava failure, veio $NAO_E_RELATORIO"; exit 1; }

  # O scanner de verdade, no próprio código deste repositório.
  contrato-deps:
    name: Contrato do workflow de auditoria (este repositório)
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read
    with:
      versao: ${{ github.sha }}

  # Espera de rollout contra um ECS SIMULADO (cmd/fake-ecs), do jeito que um
  # consumidor usa a action. Cada cenário roda em uma porta. Os que devem
  # reprovar são conferidos depois (outcome == failure).
  dogfood-rollout:
    name: Dogfood (rollout-wait, ECS simulado)
    runs-on: ubuntu-latest
    env:
      # Credenciais falsas: o SDK assina a chamada, o simulador ignora.
      AWS_ACCESS_KEY_ID: falso
      AWS_SECRET_ACCESS_KEY: falso
      AWS_REGION: us-east-1
      TD_NOVA: arn:aws:ecs:us-east-1:123456789012:task-definition/web:2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sobe o ECS simulado (um cenário por porta)
        run: |
          go build -o "$RUNNER_TEMP/fake-ecs" ./cmd/fake-ecs
          porta=8761
          for cenario in sucesso falha travado versao-antiga; do
            "$RUNNER_TEMP/fake-ecs" -scenario "$cenario" -addr "127.0.0.1:$porta" > "$RUNNER_TEMP/fake-$cenario.log" 2>&1 &
            for _ in $(seq 50); do
              (echo > "/dev/tcp/127.0.0.1/$porta") 2>/dev/null && break
              sleep 0.2
            done
            porta=$((porta + 1))
          done

      - name: Deploy que converge (deve liberar)
        uses: ./.github/actions/rollout-wait
        with:
          cluster: demo
          service: web
          task-definition: ${{ env.TD_NOVA }}
          endpoint: http://127.0.0.1:8761
          interval: 200ms
          timeout: 1m

      - name: Versão antiga estável primeiro, a nova depois (deve liberar)
        uses: ./.github/actions/rollout-wait
        with:
          cluster: demo
          service: web
          task-definition: ${{ env.TD_NOVA }}
          endpoint: http://127.0.0.1:8764
          interval: 200ms
          timeout: 1m

      - name: Circuit breaker dispara (deve reprovar na hora, sem esperar o teto)
        id: falha
        continue-on-error: true
        uses: ./.github/actions/rollout-wait
        with:
          cluster: demo
          service: web
          task-definition: ${{ env.TD_NOVA }}
          endpoint: http://127.0.0.1:8762
          interval: 200ms
          timeout: 10m

      - name: Deploy travado (deve reprovar pelo teto)
        id: travado
        continue-on-error: true
        uses: ./.github/actions/rollout-wait
        with:
          cluster: demo
          service: web
          task-definition: ${{ env.TD_NOVA }}
          endpoint: http://127.0.0.1:8763
          interval: 200ms
          timeout: 2s

      - name: Confirma que os dois cenários reprovaram de verdade
        env:
          FALHA: ${{ steps.falha.outcome }}
          TRAVADO: ${{ steps.travado.outcome }}
        run: |
          [ "$FALHA" = "failure" ] || { echo "falha: esperava failure, veio $FALHA"; exit 1; }
          [ "$TRAVADO" = "failure" ] || { echo "travado: esperava failure, veio $TRAVADO"; exit 1; }

  # Gate do apply, do jeito que um consumidor o usa. Cada cenário que deve
  # reprovar é conferido depois (outcome == failure): sem isso, um gate que nunca
  # reprova passaria no CI. Os comentários são fixtures no formato da API.
  dogfood-apply:
    name: Dogfood (apply-gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Destruição que estava no plano revisado (deve liberar)
        uses: ./.github/actions/apply-gate
        with:
          plan-json: testdata/plans/replace-common.json
          comments-json: testdata/comments/revisado-instance-web.json

      - name: Destruição sem plano revisado (deve reprovar)
        id: sem-referencia
        continue-on-error: true
        uses: ./.github/actions/apply-gate
        with:
          plan-json: testdata/plans/replace-common.json
          comments-json: testdata/comments/sem-referencia.json

      - name: Destruição fora do plano revisado (deve reprovar)
        id: fora-do-revisado
        continue-on-error: true
        uses: ./.github/actions/apply-gate
        with:
          plan-json: testdata/plans/replace-common.json
          comments-json: testdata/comments/revisado-bucket-logs.json

      - name: Comentário forjado por quem não é o bot (deve reprovar)
        id: forjado
        continue-on-error: true
        uses: ./.github/actions/apply-gate
        with:
          plan-json: testdata/plans/replace-common.json
          comments-json: testdata/comments/forjado-instance-web.json

      - name: Confirma que os três cenários reprovaram de verdade
        env:
          SEM_REFERENCIA: ${{ steps.sem-referencia.outcome }}
          FORA: ${{ steps.fora-do-revisado.outcome }}
          FORJADO: ${{ steps.forjado.outcome }}
        run: |
          status=0
          for par in "sem-referencia=$SEM_REFERENCIA" "fora-do-revisado=$FORA" "forjado=$FORJADO"; do
            if [ "${par#*=}" != "failure" ]; then
              echo "${par%%=*}: esperava failure, veio ${par#*=}"
              status=1
            fi
          done
          exit "$status"

      - name: Destruição sem referência, mas aprovada por um humano (deve liberar)
        uses: ./.github/actions/apply-gate
        with:
          plan-json: testdata/plans/replace-common.json
          approved: "true"

  # O workflow de apply inteiro: init, plan, busca do pull request, gate e
  # apply do arquivo do plano. O módulo só cria um terraform_data (sem nuvem),
  # então o apply é inofensivo, e o estado some com o runner.
  contrato-apply:
    name: Contrato do workflow de apply
    uses: ./.github/workflows/apply.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      working-directory: testdata/tf/limpo
      versao: ${{ github.sha }}

  # Demonstração de ponta a ponta do apply COM destruição, sem nuvem.
  #
  # Em pull request, o plan-gate publica (via bot) a destruição prevista de
  # testdata/tf/recria-estado. No push na main, o apply acha o pull request do
  # commit, lê esse comentário e só libera porque a destruição estava nele.
  # É o único job que exercita a busca do PR por commit com um merge de verdade.
  contrato-recriacao:
    name: Plano revisado com destruição (publica no PR)
    uses: ./.github/workflows/plan-gate.yml
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      working-directory: testdata/tf/recria-estado
      versao: ${{ github.sha }}

  apply-e2e:
    name: Apply com destruição (só no push na main)
    if: github.event_name == 'push'
    uses: ./.github/workflows/apply.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      working-directory: testdata/tf/recria-estado
      versao: ${{ github.sha }}
