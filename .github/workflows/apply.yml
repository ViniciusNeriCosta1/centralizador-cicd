# Workflow reutilizável de apply: chamado em push na branch de produção.
#
# Fluxo: init -> plan -out -> show -json -> gate -> apply DO ARQUIVO do plano.
# O gate avalia o mesmo arquivo que o apply executa, então não existe um
# segundo plano que o gate nunca viu. O plano é apagado no fim (carrega o state
# em texto puro).
#
# O que foi revisado vem do comentário que o plan-gate.yml publicou, via bot, no
# pull request que gerou este commit. Destruição fora dessa lista é bloqueada.
name: apply (reutilizável)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Diretório do módulo Terraform.
        type: string
        default: "."
      terraform-version:
        description: Use a MESMA versão do plan-gate.
        type: string
        default: "1.10.5"
      init-args:
        description: "Argumentos extras do `terraform init`, como -backend-config=..."
        type: string
        default: ""
      plan-args:
        description: "Argumentos extras do `terraform plan`, como -var-file=..."
        type: string
        default: ""
      aws-role-arn:
        description: >-
          ARN da role da AWS a assumir por OIDC (sem chave de longa duração).
          Vazio = não assume role (módulos sem AWS, ou credenciais de outro jeito).
        type: string
        default: ""
      aws-region:
        description: Região da AWS (obrigatória quando aws-role-arn é informado).
        type: string
        default: ""
      versao:
        description: Ref (tag, branch ou sha) desta ferramenta a usar.
        type: string
        default: v1

permissions:
  contents: read
  pull-requests: read
  # Necessário para pedir o token OIDC. Um workflow reutilizável não consegue
  # pedir esta permissão só quando o chamador usa OIDC: o chamador precisa
  # concedê-la sempre (por isso esta mudança é de major).
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credenciais de curta duração, emitidas pelo OIDC do GitHub: não existe
      # chave de acesso guardada no repositório. Quem limita o que o workflow
      # pode fazer é a trust policy da role (veja examples/aws-oidc-trust.tf).
      - name: Confere os inputs de OIDC
        if: inputs.aws-role-arn != ''
        env:
          ROLE: ${{ inputs.aws-role-arn }}
          REGION: ${{ inputs.aws-region }}
        run: |
          if ! [[ "$ROLE" =~ ^arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "aws-role-arn não parece o ARN de uma role: $ROLE"
            exit 1
          fi
          if [ -z "$REGION" ]; then
            echo "aws-region é obrigatório quando aws-role-arn é informado"
            exit 1
          fi

      - name: Credenciais da AWS por OIDC
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: cicd-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform init e plan
        id: plano
        working-directory: ${{ inputs.working-directory }}
        env:
          INIT_ARGS: ${{ inputs.init-args }}
          PLAN_ARGS: ${{ inputs.plan-args }}
        run: |
          # shellcheck disable=SC2086
          terraform init -input=false $INIT_ARGS
          # shellcheck disable=SC2086
          terraform plan -input=false -out="$RUNNER_TEMP/plano.tfplan" $PLAN_ARGS
          terraform show -json "$RUNNER_TEMP/plano.tfplan" > "$RUNNER_TEMP/plano.json"

      # O pull request que gerou o commit tem o plano revisado (comentário do
      # bot) e o label de aprovação. Sem pull request, não há referência.
      - name: Busca o pull request do commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo '[]' > "$RUNNER_TEMP/comentarios.json"
          echo "approved=false" >> "$GITHUB_OUTPUT"
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "$pr" ]; then
            echo "nenhum pull request associado a $SHA: sem plano revisado para comparar"
            exit 0
          fi
          echo "pull request #$pr"
          gh api --paginate "repos/$REPO/issues/$pr/comments" > "$RUNNER_TEMP/comentarios.json"
          if gh api "repos/$REPO/issues/$pr/labels" --jq '.[].name' | grep -qx 'destruicao-aprovada'; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixa a ferramenta na versão pedida
        uses: actions/checkout@v4
        with:
          repository: ViniciusNeriCosta1/centralizador-cicd
          ref: ${{ inputs.versao }}
          path: .cicd-ferramenta

      - name: Gate do apply
        uses: ./.cicd-ferramenta/.github/actions/apply-gate
        with:
          plan-json: ${{ runner.temp }}/plano.json
          comments-json: ${{ runner.temp }}/comentarios.json
          dir: ${{ inputs.working-directory }}
          approved: ${{ steps.pr.outputs.approved }}

      # As tags também valem no apply: o plano pode ter mudado desde o pull
      # request. Se o gate ou as tags reprovam, o apply abaixo não roda.
      - name: Gate de tags obrigatórias
        if: ${{ !cancelled() && steps.plano.outcome == 'success' }}
        uses: ./.cicd-ferramenta/.github/actions/tag-check
        with:
          plan-json: ${{ runner.temp }}/plano.json

      # Aplica o ARQUIVO do plano: exatamente o que o gate avaliou.
      - name: terraform apply do plano avaliado
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -input=false "$RUNNER_TEMP/plano.tfplan"

      - name: Apaga o plano (carrega o state em texto puro)
        if: always()
        run: rm -f "$RUNNER_TEMP/plano.tfplan" "$RUNNER_TEMP/plano.json" "$RUNNER_TEMP/comentarios.json"
