# Workflow reutilizável: o projeto consumidor só chama este arquivo.
#
# Gera o plano do Terraform, converte para JSON e aplica o gate de recriação.
# O plano fica em RUNNER_TEMP e é apagado no fim: ele carrega o state em texto
# puro e NÃO deve virar artifact.
name: plan-gate (reutilizável)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Diretório do módulo Terraform.
        type: string
        default: "."
      terraform-version:
        type: string
        default: "1.10.5"
      init-args:
        description: "Argumentos extras do `terraform init`, como -backend-config=..."
        type: string
        default: ""
      plan-args:
        description: "Argumentos extras do `terraform plan`, como -var-file=..."
        type: string
        default: ""
      aws-role-arn:
        description: >-
          ARN da role da AWS a assumir por OIDC (sem chave de longa duração).
          Vazio = não assume role (módulos sem AWS, ou credenciais de outro jeito).
        type: string
        default: ""
      aws-region:
        description: Região da AWS (obrigatória quando aws-role-arn é informado).
        type: string
        default: ""
      versao:
        description: Ref (tag, branch ou sha) desta ferramenta a usar.
        type: string
        default: v1

permissions:
  contents: read
  # Publica no pull request o plano revisado (o apply compara com ele).
  pull-requests: write
  # Necessário para pedir o token OIDC (veja apply.yml).
  id-token: write

jobs:
  plan-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credenciais de curta duração, emitidas pelo OIDC do GitHub: não existe
      # chave de acesso guardada no repositório. Quem limita o que o workflow
      # pode fazer é a trust policy da role (veja examples/aws-oidc-trust.tf).
      - name: Confere os inputs de OIDC
        if: inputs.aws-role-arn != ''
        env:
          ROLE: ${{ inputs.aws-role-arn }}
          REGION: ${{ inputs.aws-region }}
        run: |
          if ! [[ "$ROLE" =~ ^arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "aws-role-arn não parece o ARN de uma role: $ROLE"
            exit 1
          fi
          if [ -z "$REGION" ]; then
            echo "aws-region é obrigatório quando aws-role-arn é informado"
            exit 1
          fi

      - name: Credenciais da AWS por OIDC
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: cicd-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform init e plan
        working-directory: ${{ inputs.working-directory }}
        env:
          INIT_ARGS: ${{ inputs.init-args }}
          PLAN_ARGS: ${{ inputs.plan-args }}
        run: |
          # Os argumentos extras são separados por espaço de propósito.
          # shellcheck disable=SC2086
          terraform init -input=false $INIT_ARGS
          # shellcheck disable=SC2086
          terraform plan -input=false -out="$RUNNER_TEMP/plano.tfplan" $PLAN_ARGS
          terraform show -json "$RUNNER_TEMP/plano.tfplan" > "$RUNNER_TEMP/plano.json"

      - name: Baixa a ferramenta na versão pedida
        uses: actions/checkout@v4
        with:
          repository: ViniciusNeriCosta1/centralizador-cicd
          ref: ${{ inputs.versao }}
          path: .cicd-ferramenta

      - name: Gate de recriação
        uses: ./.cicd-ferramenta/.github/actions/plan-gate
        with:
          plan-json: ${{ runner.temp }}/plano.json
          # A aprovação é um label no pull request. Para o gate reagir a ele,
          # o chamador precisa disparar também em `labeled` e `unlabeled`.
          approved: ${{ contains(github.event.pull_request.labels.*.name, 'destruicao-aprovada') }}

      # O apply só libera destruição que apareça neste comentário. Publicado
      # mesmo com o gate reprovando: quem revisa precisa ver o que o plano faz.
      - name: Publica o plano revisado no pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          cicd="$RUNNER_TEMP/cicd"
          if [ ! -f "$RUNNER_TEMP/plano.json" ] || [ ! -x "$cicd" ]; then
            echo "sem plano para publicar (um passo anterior falhou)"
            exit 0
          fi
          "$cicd" review-comment -plan "$RUNNER_TEMP/plano.json" -dir "$DIR" > "$RUNNER_TEMP/comentario.md"
          gh api --paginate "repos/$REPO/issues/$PR/comments" > "$RUNNER_TEMP/comentarios.json"
          id="$("$cicd" reviewed-id -comments "$RUNNER_TEMP/comentarios.json" -dir "$DIR")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comentario.md" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comentario.md" > /dev/null
          fi

      - name: Apaga o plano (carrega o state em texto puro)
        if: always()
        run: rm -f "$RUNNER_TEMP/plano.tfplan" "$RUNNER_TEMP/plano.json" "$RUNNER_TEMP/comentarios.json" "$RUNNER_TEMP/comentario.md"
