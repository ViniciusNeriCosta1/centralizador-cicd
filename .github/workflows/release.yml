# Release: tag semver estrita (vX.Y.Z) publica a release e move o alias móvel da
# major (v1, v2...). O consumidor fixa `@v1` e recebe as correções compatíveis;
# quem precisa de reprodutibilidade fixa a tag imutável vX.Y.Z.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valida a tag (semver estrito, sem pré-release)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag fora do semver estrito: $TAG"
            exit 1
          fi
          echo "MAJOR=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Só publica commits que estão na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "o commit da tag não está na main"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Não publica versão quebrada
        run: |
          go vet ./...
          go test ./...

      - name: Notas da versão (vêm do CHANGELOG)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          versao="${TAG#v}"
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" { achou=1; next }
            achou && /^## \[/      { exit }
            achou                  { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notas.md"; then
            echo "CHANGELOG.md não tem a seção [$versao]"
            exit 1
          fi

      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notas.md" --verify-tag

      - name: Move o alias da major (só se esta for a maior versão dela)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          maior="$(git tag --list "${MAJOR}.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ "$maior" != "$TAG" ]; then
            echo "$TAG não é a maior ${MAJOR}.x ($maior): o alias $MAJOR não se move"
            exit 0
          fi
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "alias $MAJOR -> $TAG" >> "$GITHUB_STEP_SUMMARY"
