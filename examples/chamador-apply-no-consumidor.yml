# Exemplo: o apply de um projeto consumidor. Também é só uma chamada.
#
# O apply compara o que vai destruir com o plano revisado no pull request (o
# comentário que o plan-gate publicou) e bloqueia o que não estava lá.
name: Apply

on:
  push:
    branches: [main]

# Dois applies ao mesmo tempo no mesmo state se atropelam.
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  apply:
    uses: ViniciusNeriCosta1/centralizador-cicd/.github/workflows/apply.yml@v1
    with:
      working-directory: infra
