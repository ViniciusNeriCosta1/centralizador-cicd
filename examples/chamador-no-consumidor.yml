# Exemplo: o que um projeto consumidor escreve. É só uma chamada.
#
# `labeled` e `unlabeled` fazem o gate rodar de novo quando alguém adiciona ou
# remove o label `destruicao-aprovada`, que é como a recriação de um recurso
# sensível é aprovada de forma explícita.
name: Plan gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write   # publica o plano revisado, que o apply usa
  id-token: write        # pede o token OIDC (obrigatório, mesmo sem usar a AWS)

jobs:
  plan-gate:
    uses: ViniciusNeriCosta1/centralizador-cicd/.github/workflows/plan-gate.yml@v2
    with:
      working-directory: infra
      # Para módulos na AWS: role só de leitura (veja aws-oidc-trust.tf).
      # aws-role-arn: arn:aws:iam::123456789012:role/cicd-plan
      # aws-region: us-east-1
