# Exemplo: o que um projeto consumidor escreve. É só uma chamada.
#
# `labeled` e `unlabeled` fazem o gate rodar de novo quando alguém adiciona ou
# remove o label `destruicao-aprovada`, que é como a recriação de um recurso
# sensível é aprovada de forma explícita.
name: Plan gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write   # publica o plano revisado, que o apply usa

jobs:
  plan-gate:
    uses: ViniciusNeriCosta1/centralizador-cicd/.github/workflows/plan-gate.yml@v1
    with:
      working-directory: infra
